services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: event-agent-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq
    ports:
      - "8501:8501"

  debug:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["debug"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq
    volumes:
      - ./:/app
    command: ["python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "-m", "streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
      - "5678:5678"
